name: Import ClipForge 1.72 and verify source

on:
  push:
    paths:
      - ".github/workflows/remote-e2e.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clipforge-v172-import
  cancel-in-progress: false

jobs:
  import-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify the exact ClipForge 1.72 archive
        env:
          ARCHIVE_URL: "https://d2ol7oe51mr4n9.cloudfront.net/user_3LToalXIeRhotwt73mILMowhr27/bd143594-5f3e-4814-aaa5-702c24900bae.zip"
          EXPECTED_SHA256: "fd6310aab4870e702a110a9477d4b87ee31d87a55aa7ff731deeb8d113f44e34"
        run: |
          set -euo pipefail
          mkdir -p /tmp/clipforge-import dist
          curl --fail --location --retry 3 --retry-delay 2 "$ARCHIVE_URL" -o /tmp/ClipForge_v172_mlx_turbo_2.zip
          echo "$EXPECTED_SHA256  /tmp/ClipForge_v172_mlx_turbo_2.zip" | sha256sum --check
          unzip -q /tmp/ClipForge_v172_mlx_turbo_2.zip -d /tmp/clipforge-import
          test -f /tmp/clipforge-import/ClipForge/server.py
          test -f /tmp/clipforge-import/ClipForge/clipforge.py
          test -f /tmp/clipforge-import/ClipForge/README.md
          cp /tmp/ClipForge_v172_mlx_turbo_2.zip dist/ClipForge_v172_mlx_turbo_2.zip

      - name: Import all application source files without overwriting repository automation
        run: |
          set -euo pipefail
          rsync -a --exclude='.github' /tmp/clipforge-import/ClipForge/ ./
          if [ -f /tmp/clipforge-import/ClipForge/.github/workflows/mlx-macos.yml ]; then
            mkdir -p source-package-workflows
            cp /tmp/clipforge-import/ClipForge/.github/workflows/mlx-macos.yml source-package-workflows/mlx-macos-v172.yml
          fi
          test -f server.py
          test -f static/index.html
          test -f tests/test_web.py

      - name: Install FFmpeg required by media integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run source and syntax checks
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile server.py clipforge.py channel_monitor.py diarization.py job_store.py project_store.py worker.py
          PYTHONPATH=. pytest -q tests/
          node --check static/app.js
          node --check static/editor.js

      - name: Commit complete source and original archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Import complete ClipForge 1.72 source and archive"
          git push origin HEAD:main
