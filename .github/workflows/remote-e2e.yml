name: ClipForge remote transcription and render proof

on:
  push:
    paths:
      - "cloud/**"
      - ".github/workflows/remote-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clipforge-remote-e2e
  cancel-in-progress: false

jobs:
  transcribe-render-validate:
    # Public repository: standard GitHub-hosted Linux runners are free.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "faster-whisper>=1.1,<2"
      - name: Download canonical public reference video (first 213.34 seconds)
        run: |
          python -m pip install yt-dlp
          yt-dlp --no-playlist --download-sections "*0-213.34" --force-keyframes-at-cuts             -f "bv*[height<=1080]+ba/b[height<=1080]"             --merge-output-format mp4             -o input.%(ext)s             "https://www.youtube.com/watch?v=85d_IyE56SA"
          test -s input.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 input.mp4
      - name: Real Spanish transcription, highlight extraction and subtitle render
        env:
          VIDEO_PATH: input.mp4
          WHISPER_MODEL: large-v3-turbo
          MAX_CLIPS: "3"
          OMP_NUM_THREADS: "4"
        run: python cloud/remote_e2e.py
      - name: Upload proof (transcript, word timings, clips and validation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-la-resistencia-remote-e2e
          path: cloud-output/
          if-no-files-found: error
          retention-days: 7
