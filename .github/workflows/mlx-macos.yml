name: MLX Whisper macOS ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mlx-macos.yml"
      - "mlx_smoke_test.py"

permissions:
  contents: read

jobs:
  mlx-whisper:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          system_profiler SPHardwareDataType | grep -E "Chip|Processor Name" || true
          python3 --version
      - name: Install MLX Whisper
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install mlx-whisper
          python -c "import mlx.core as mx; import mlx_whisper; print('MLX device:', mx.default_device())"
      - name: Generate Spanish speech fixture
        run: |
          set -euo pipefail
          mkdir -p test-output
          VOICE="$(say -v '?' | awk 'tolower($0) ~ /spanish|español/ {print $1; exit}')"
          if [ -z "$VOICE" ]; then echo "No Spanish voice available" >&2; exit 1; fi
          say -v "$VOICE" -o test-output/spanish.aiff "Esta es una prueba de transcripción en español para ClipForge."
          afconvert test-output/spanish.aiff -f WAVE -d LEI16@16000 test-output/spanish.wav
      - name: Real transcription with large-v3-turbo
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python mlx_smoke_test.py
      - name: Upload transcription evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-whisper-macos-arm64-evidence
          path: test-output/
          if-no-files-found: warn
          retention-days: 7
