# ClipForge Studio: one user-facing website with same-origin API routing.
# Keep the static web URL as the public entry point. The API remains a backend
# service; browser requests to /api/* are rewritten to it by Render.
# Auxiliary importer/preview services are retired only after end-to-end checks.
services:
  - type: web
    name: clipforge-final
    runtime: static
    repo: https://github.com/hugoaguilera022/ClipForge
    branch: codex/clipforge-editor-stabilization
    buildCommand: echo "ClipForge static frontend ready"
    staticPublishPath: static
    autoDeployTrigger: off
    routes:
      - type: rewrite
        source: /api/*
        destination: https://clipforge-api-hugo.onrender.com/api/*

  - type: web
    name: clipforge-api-hugo
    runtime: docker
    repo: https://github.com/hugoaguilera022/ClipForge
    branch: codex/clipforge-editor-stabilization
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.clipforge-api
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: CLIPFORGE_HOST
        value: 0.0.0.0
