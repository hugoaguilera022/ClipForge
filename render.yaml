# ClipForge Studio — one public Render web service.
# The Python backend serves static/, /api/*, previews and exports on one origin.
# Keep legacy services until this single service passes full browser/media tests.
services:
  - type: web
    name: clipforge-studio
    runtime: docker
    repo: https://github.com/hugoaguilera022/ClipForge
    branch: codex/clipforge-single-web-integration
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.clipforge-api
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: CLIPFORGE_HOST
        value: 0.0.0.0
