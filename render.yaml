# Unified ClipForge Studio deployment.
# One public web service serves the UI, API, previews and exports on the same origin.
# Keep existing Render services untouched until this service passes end-to-end validation.
services:
  - type: web
    name: clipforge-studio
    runtime: docker
    repo: https://github.com/hugoaguilera022/ClipForge
    branch: codex/clipforge-single-web-integration
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.clipforge-api
    dockerContext: .
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: CLIPFORGE_HOST
        value: 0.0.0.0
