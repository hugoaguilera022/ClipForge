# ClipForge Studio — adopt and deploy the existing production API as the only public web app.
# The Python server serves the frontend, API, previews, imports and exports on one origin.
services:
  - type: web
    name: clipforge-api-hugo
    runtime: docker
    repo: https://github.com/hugoaguilera022/ClipForge
    branch: codex/clipforge-single-web-integration
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.clipforge-api
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /api/health
